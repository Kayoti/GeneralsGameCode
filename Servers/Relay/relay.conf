# Relay configuration for Servers mode. Format: docs/servers/PROTOCOL.md, section 7.2.
# This example is the European relay. Each relay serves one region, so a new
# region runs its own relay with its own copy of this file. Change region,
# listen_port and key_file for that relay, and add its block to the client
# region file (Servers/Client/regions.txt).

region            = 1
listen_port       = 7777
ping_limit_ms     = 150
key_file          = keys/region.key
max_sessions      = 200
vpn_check         = on
vpn_ranges        = data/blocked-ranges.txt
vpn_operators     = data/blocked-operators.txt
vpn_operator_db   = data/address-to-operator.mmdb
vpn_allow         = data/allowed-ranges.txt
