# Example configuration of the lobby service (docs/servers/SERVICE.md section 11).
# It holds no secrets. Set LOBBY_TURN_SECRET in the environment for the TURN secret.
listen = 127.0.0.1:9000
database = lobby.db
public_ws_url = ws://127.0.0.1:9000/ws
motd = Welcome
rooms = Lobby
turn_secret =
accounts_per_address_per_hour = 5
trust_forwarded_for = off
region.1.tag = eu
region.1.public_key = keys/region.key.pub
